[tool.pytest.ini_options]
pythonpath = ["."]
qt_api = "pyside6"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "donedef"
version = "0.1.0"
description = "定标 DoneDef：先定义完成标准，再让本机的 claude / codex / grok CLI 按需求、开发、验证三个关卡干活，人只做审核"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = ["PySide6>=6.12"]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-qt>=4.5", "pyflakes>=4"]

[project.scripts]
donedef = "donedef.__main__:main"

[tool.setuptools]
packages = ["donedef"]

[tool.setuptools.package-data]
donedef = ["assets/*.svg"]
